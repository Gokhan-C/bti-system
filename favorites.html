<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Favorilerim · GTİP Bulutları</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
 *{box-sizing:border-box;margin:0;padding:0}
 body{font-family:'Hanken Grotesk',system-ui,-apple-system,sans-serif;color:#16202b;background:#f4f8fc;line-height:1.55;-webkit-font-smoothing:antialiased}
 .mono{font-family:'JetBrains Mono',ui-monospace,monospace}
 .wrap{max-width:1080px;margin:0 auto;padding:26px 22px 80px}
 .back{display:inline-flex;align-items:center;gap:7px;color:#5f7184;text-decoration:none;font-size:14px;font-weight:600}
 .back:hover{color:#16202b}
 h1{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:clamp(26px,3.4vw,38px);letter-spacing:-1.2px;margin-top:6px}
 .sub{color:#5f7184;font-size:15px;margin-top:2px}
 .top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
 .acts{display:flex;gap:8px;flex-wrap:wrap}
 .btn{border:1px solid #e2e8f1;background:#fff;border-radius:11px;padding:10px 16px;font-size:13.5px;font-weight:600;color:#5f7184;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:7px}
 .btn:hover{color:#16202b;border-color:#c7d3e2}
 .btn.dark{background:#16202b;color:#fff;border-color:#16202b}
 .searchbar{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
 .searchbar input{flex:1;min-width:240px;border:1px solid #e2e8f1;background:#fff;border-radius:13px;padding:14px 18px;font-size:15px;font-family:inherit;color:#16202b;outline:none}
 .searchbar input:focus{border-color:#2f6bdf;box-shadow:0 0 0 4px rgba(47,107,223,.10)}
 .filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
 .chipf{border:1px solid #e2e8f1;background:#fff;border-radius:10px;padding:8px 14px;font-size:13.5px;font-weight:600;color:#5f7184;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-family:inherit}
 .chipf .dot{width:9px;height:9px;border-radius:50%}
 .chipf.on{color:#16202b;border-color:#c7d3e2;box-shadow:0 6px 18px rgba(40,90,160,.08)}
 .count{color:#8693a6;font-size:13.5px;margin-top:16px}
 .list{margin-top:14px;display:flex;flex-direction:column;gap:14px}
 .item{background:#fff;border:1px solid #e6ebf2;border-radius:18px;padding:20px 22px;box-shadow:0 10px 30px rgba(40,90,160,.05)}
 .ih{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
 .hs{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:24px;letter-spacing:-.5px;line-height:1}
 .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:7px;font-size:12.5px;color:#8693a6}
 .pill{display:inline-flex;align-items:center;gap:6px;font-weight:600}
 .pill i{width:8px;height:8px;border-radius:50%}
 .ttl{margin-top:12px;font-size:15px;color:#23303f}
 .ger{margin-top:8px;font-size:13.5px;color:#5f7184}
 .noteWrap{margin-top:14px}
 .noteWrap label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#6f86ad;font-weight:700;margin-bottom:5px}
 .noteWrap textarea{width:100%;min-height:62px;border:1px solid #e6ebf2;background:#fbfdff;border-radius:12px;padding:11px 13px;font-size:14px;font-family:inherit;color:#23303f;resize:vertical;outline:none;line-height:1.5}
 .noteWrap textarea:focus{border-color:#2f6bdf;background:#fff;box-shadow:0 0 0 4px rgba(47,107,223,.08)}
 .saved{font-size:12px;color:#22a06b;font-weight:600;opacity:0;transition:opacity .2s}
 .saved.on{opacity:1}
 .ifoot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}
 .small{border:1px solid #e2e8f1;background:#fff;border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;color:#5f7184;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
 .small:hover{color:#16202b}
 .small.rm:hover{color:#d94a4a;border-color:#f0c9c9}
 .empty{background:#fff;border:1px dashed #d7e0ea;border-radius:20px;padding:60px 30px;text-align:center;margin-top:22px}
 .empty .star{font-size:44px;line-height:1}
 .empty h3{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:600;margin-top:14px}
 .empty p{color:#5f7184;font-size:15px;margin-top:8px;max-width:460px;margin-left:auto;margin-right:auto}
 .empty .btn{margin-top:20px}
 /* Elle BTI Aktar penceresi */
 .ovl{position:fixed;inset:0;background:rgba(22,32,43,.42);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:40px 18px;overflow:auto;z-index:60}
 .ovl.on{display:flex}
 .dlg{background:#fff;border:1px solid #e6ebf2;border-radius:20px;width:100%;max-width:620px;padding:24px 26px;box-shadow:0 30px 80px rgba(40,90,160,.20)}
 .dlgh{display:flex;align-items:center;justify-content:space-between;gap:12px}
 .dlgh h2{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:21px;letter-spacing:-.5px}
 .x{border:0;background:transparent;font-size:20px;color:#8693a6;cursor:pointer;line-height:1;padding:4px 8px;border-radius:8px}
 .x:hover{color:#16202b;background:#f1f5fa}
 .dlgsub{color:#5f7184;font-size:14px;margin-top:4px}
 #mForm{margin-top:18px}
 .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
 .fld{display:flex;flex-direction:column;margin-bottom:14px}
 .grid .fld{margin-bottom:0}
 .fld label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#6f86ad;font-weight:700;margin-bottom:5px}
 .fld input,.fld select,.fld textarea{border:1px solid #e6ebf2;background:#fbfdff;border-radius:11px;padding:11px 13px;font-size:14.5px;font-family:inherit;color:#23303f;outline:none;resize:vertical;width:100%}
 .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:#2f6bdf;background:#fff;box-shadow:0 0 0 4px rgba(47,107,223,.08)}
 .dlgf{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:6px}
 .dlgf .err{margin-right:auto;color:#d94a4a;font-size:13px;font-weight:600}
 @media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <a class="back" href="index.html" data-i18n="back">← GTİP Bulutları</a>
      <h1 data-i18n="page_title">★ Favorilerim</h1>
      <div class="sub" id="sub">Kaydettiğin kararlar bu tarayıcıda saklanır.</div>
    </div>
    <div class="acts">
      <button class="btn dark" id="manualAdd" data-i18n="btn_manual">+ Elle BTI Aktar</button>
      <a class="btn" href="dashboard.html" data-i18n="btn_dash">İstatistik paneli</a>
      <button class="btn" id="expCsv" data-i18n="btn_csv">CSV indir</button>
      <button class="btn" id="expJson" data-i18n="btn_json">JSON indir</button>
    </div>
  </div>

  <div id="content"></div>
</div>

<!-- Elle BTI Aktar penceresi -->
<div class="ovl" id="ovl" aria-hidden="true">
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <div class="dlgh">
      <h2 id="dlgTitle" data-i18n="m_title">Elle BTI Aktar</h2>
      <button class="x" id="mClose" aria-label="Kapat">✕</button>
    </div>
    <p class="dlgsub" data-i18n="m_sub">Bir BTI kararını elle favorilere ekle. Linkinden gelen bilgileri buraya yapıştırabilirsin.</p>
    <form id="mForm" autocomplete="off">
      <div class="grid">
        <div class="fld">
          <label data-i18n="m_hs">GTİP / HS kodu</label>
          <input name="hs" class="mono" placeholder="8471 30 00 00" required>
        </div>
        <div class="fld">
          <label data-i18n="m_src">Kaynak</label>
          <select name="source">
            <option value="eu">Avrupa Birliği (EBTI)</option>
            <option value="us">Amerika (CBP)</option>
            <option value="ca">Kanada (CBSA)</option>
            <option value="tr">Türkiye</option>
            <option value="uk">Birleşik Krallık</option>
            <option value="manual" selected data-i18n="m_src_manual">Diğer / Elle</option>
          </select>
        </div>
        <div class="fld">
          <label data-i18n="m_ref">Referans no</label>
          <input name="ref" class="mono" placeholder="DEBTI…">
        </div>
        <div class="fld">
          <label data-i18n="m_country">Ülke</label>
          <input name="origin" placeholder="Almanya">
        </div>
        <div class="fld">
          <label data-i18n="m_date">Tarih</label>
          <input name="date" type="date">
        </div>
        <div class="fld">
          <label data-i18n="m_url">Link (URL)</label>
          <input name="url" type="url" placeholder="https://…">
        </div>
      </div>
      <div class="fld">
        <label data-i18n="m_ttl">Eşya tanımı</label>
        <textarea name="title" rows="2" placeholder=""></textarea>
      </div>
      <div class="fld">
        <label data-i18n="m_ger">Sınıflandırma gerekçesi</label>
        <textarea name="gerekce" rows="3" placeholder=""></textarea>
      </div>
      <div class="fld">
        <label data-i18n="m_note">Notum</label>
        <textarea name="note" rows="2" data-i18n-ph="m_note_ph" placeholder="Bu karar hakkında notun…"></textarea>
      </div>
      <div class="dlgf">
        <span class="err" id="mErr"></span>
        <button type="button" class="btn" id="mCancel" data-i18n="m_cancel">Vazgeç</button>
        <button type="submit" class="btn dark" data-i18n="m_save">Favorilere ekle</button>
      </div>
    </form>
  </div>
</div>

<script src="favorites.js?v=1787513213"></script>
<script src="i18n.js?v=1787512915"></script>
<script>
// ---- dil sözlüğü (ortak motor: i18n.js) ----
BTIi18n.dict({
  tr:{ back:'← GTİP Bulutları', page_title:'★ Favorilerim', btn_dash:'İstatistik paneli',
       btn_csv:'CSV indir', btn_json:'JSON indir',
       sub_empty:'Kaydettiğin kararlar bu tarayıcıda saklanır.',
       sub_count:'kayıtlı karar · bu tarayıcıda saklanır',
       empty_h:'Henüz favori kararın yok',
       empty_p:'Gökyüzünde bir bulutun üzerine gelip sağ üstteki <b>★</b> işaretine tıkla, ya da istatistik panelindeki karar listesinden yıldızla. Kaydettiklerin burada birikir — not ekleyebilir, sonra arayabilirsin.',
       empty_btn:'Gökyüzüne git',
       search_ph:'GTİP, ürün, gerekçe, not veya ülke ara…',
       all_tab:'Tümü', decisions:'karar', search_of:'araması',
       none_h:'Eşleşen karar yok', none_p:'Arama terimini değiştirmeyi dene.',
       note_label:'Notum', note_saved:'✓ kaydedildi', note_ph:'Bu karar hakkında notun… (otomatik kaydedilir)',
       open:'↗ Kararı aç', remove:'★ Favorilerden çıkar',
       btn_manual:'+ Elle BTI Aktar',
       m_title:'Elle BTI Aktar', m_sub:'Bir BTI kararını elle favorilere ekle. Linkinden gelen bilgileri buraya yapıştırabilirsin.',
       m_hs:'GTİP / HS kodu', m_src:'Kaynak', m_src_manual:'Diğer / Elle', m_ref:'Referans no',
       m_country:'Ülke', m_date:'Tarih', m_url:'Link (URL)', m_ttl:'Eşya tanımı',
       m_ger:'Sınıflandırma gerekçesi', m_note:'Notum', m_note_ph:'Bu karar hakkında notun…',
       m_cancel:'Vazgeç', m_save:'Favorilere ekle', m_err_hs:'En az GTİP / HS kodu gir.',
       m_dup:'Bu karar zaten favorilerinde.' },
  en:{ back:'← HS Clouds', page_title:'★ My favourites', btn_dash:'Statistics panel',
       btn_csv:'Download CSV', btn_json:'Download JSON',
       sub_empty:'Rulings you save are stored in this browser.',
       sub_count:'saved rulings · stored in this browser',
       empty_h:'You have no saved rulings yet',
       empty_p:'Hover a cloud in the sky and click the <b>★</b> in its top-right corner, or star a ruling from the list in the statistics panel. Everything you save collects here — you can add a note and search it later.',
       empty_btn:'Go to the sky',
       search_ph:'Search HS code, product, reasoning, note or country…',
       all_tab:'All', decisions:'rulings', search_of:'search',
       none_h:'No matching rulings', none_p:'Try changing your search terms.',
       note_label:'My note', note_saved:'✓ saved', note_ph:'Your note about this ruling… (saved automatically)',
       open:'↗ Open ruling', remove:'★ Remove from favourites',
       btn_manual:'+ Add BTI manually',
       m_title:'Add BTI manually', m_sub:'Add a BTI ruling to your favourites by hand. Paste the details from its link here.',
       m_hs:'HS / CN code', m_src:'Source', m_src_manual:'Other / Manual', m_ref:'Reference no',
       m_country:'Country', m_date:'Date', m_url:'Link (URL)', m_ttl:'Description of goods',
       m_ger:'Classification reasoning', m_note:'My note', m_note_ph:'Your note about this ruling…',
       m_cancel:'Cancel', m_save:'Add to favourites', m_err_hs:'Enter at least an HS / CN code.',
       m_dup:'This ruling is already in your favourites.' }
});
const T = k => BTIi18n.t(k);

const SRC = {
  eu:{name:'Avrupa Birliği', short:'AB', color:'#2f6bdf'},
  us:{name:'Amerika',        short:'ABD',color:'#d07d2a'},
  ca:{name:'Kanada',         short:'KAN',color:'#169b8b'},
  tr:{name:'Türkiye',        short:'TR', color:'#e30a17'},
  uk:{name:'Birleşik Krallık',short:'UK',color:'#6b4ee6'},
  manual:{name:'Elle eklenen', short:'ELLE', color:'#8693a6'},
};
const srcOf = s => { var b = SRC[s] || {name:s||'—', short:(s||'?').toUpperCase(), color:'#8693a6'};
  return Object.assign({}, b, {name: BTIi18n.srcName(s)||b.name}); };
let q = '', srcFilter = 'all';

const esc = t => (t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fmtDate(iso){ return BTIi18n.fmtDate(iso); }

function render(){
  const el = document.getElementById('content');
  const total = BTIFav.count();

  if(!total){
    el.innerHTML = `<div class="empty">
      <div class="star">☆</div>
      <h3>${T('empty_h')}</h3>
      <p>${T('empty_p')}</p>
      <a class="btn dark" href="index.html">${T('empty_btn')}</a>
    </div>`;
    document.getElementById('sub').textContent = T('sub_empty');
    return;
  }

  let list = BTIFav.search(q);
  if(srcFilter !== 'all') list = list.filter(f => f.source === srcFilter);

  const present = [...new Set(BTIFav.all().map(f=>f.source))];
  const chips = ['all', ...present].map(s=>{
    const on = srcFilter===s;
    if(s==='all') return `<button class="chipf ${on?'on':''}" data-src="all"><span class="dot" style="background:#16202b"></span>${T('all_tab')} (${total})</button>`;
    const m=srcOf(s), n=BTIFav.all().filter(f=>f.source===s).length;
    return `<button class="chipf ${on?'on':''}" data-src="${s}"><span class="dot" style="background:${m.color}"></span>${m.name} (${n})</button>`;
  }).join('');

  el.innerHTML = `
    <div class="searchbar">
      <input id="q" type="search" placeholder="${T('search_ph')}" value="${esc(q)}">
    </div>
    <div class="filters">${chips}</div>
    <div class="count">${list.length} ${T('decisions')}${q?` · "${esc(q)}" ${T('search_of')}`:''}</div>
    <div class="list">${list.map(itemHtml).join('') || `<div class="empty"><div class="star">🔍</div><h3>${T('none_h')}</h3><p>${T('none_p')}</p></div>`}</div>`;

  document.getElementById('sub').textContent = `${total} ${T('sub_count')}`;

  const qi = document.getElementById('q');
  if(qi){
    qi.oninput = e => { q = e.target.value; const p=e.target.selectionStart; render();
      const n=document.getElementById('q'); if(n){ n.focus(); n.setSelectionRange(p,p);} };
  }
  el.querySelectorAll('.chipf').forEach(b=>b.onclick=()=>{ srcFilter=b.dataset.src; render(); });
  el.querySelectorAll('textarea[data-id]').forEach(t=>{
    let tm;
    t.oninput = () => {
      clearTimeout(tm);
      tm = setTimeout(()=>{
        BTIFav.setNote(t.dataset.id, t.value);
        const s=t.parentElement.querySelector('.saved');
        if(s){ s.classList.add('on'); setTimeout(()=>s.classList.remove('on'),1400); }
      }, 450);
    };
  });
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
    BTIFav.remove(b.dataset.rm); render();
  });
}

function itemHtml(f){
  const m = srcOf(f.source);
  return `<div class="item">
    <div class="ih">
      <div>
        <div class="hs" style="color:${m.color}">${esc(f.hs4||'—')}</div>
        <div class="meta">
          <span class="pill" style="color:${m.color}"><i style="background:${m.color}"></i>${esc(m.name)}</span>
          ${f.origin&&f.origin!==m.name?`<span>· ${esc(BTIi18n.originName(f.origin))}</span>`:''}
          ${f.hs?`<span class="mono">· ${esc(f.hs)}</span>`:''}
          ${f.ref?`<span class="mono">· ${esc(f.ref)}</span>`:''}
          ${f.date?`<span>· ${fmtDate(f.date)}</span>`:''}
        </div>
      </div>
    </div>
    ${BTIi18n.title(f)?`<div class="ttl">${esc(BTIi18n.title(f))}</div>`:''}
    ${BTIi18n.reason(f)?`<div class="ger">${esc(BTIi18n.reason(f))}</div>`:''}
    <div class="noteWrap">
      <label>${T('note_label')} <span class="saved">${T('note_saved')}</span></label>
      <textarea data-id="${esc(f.id)}" placeholder="${T('note_ph')}">${esc(f.note||'')}</textarea>
    </div>
    <div class="ifoot">
      ${f.url?`<a class="small" href="${esc(f.url)}" target="${f.url.startsWith('http')?'_blank':'_self'}" rel="noopener">${T('open')}</a>`:'<span></span>'}
      <button class="small rm" data-rm="${esc(f.id)}">${T('remove')}</button>
    </div>
  </div>`;
}

document.getElementById('expCsv').onclick = () =>
  BTIFav.download('favori_bti_kararlarim.csv', '﻿'+BTIFav.exportCSV(), 'text/csv');
document.getElementById('expJson').onclick = () =>
  BTIFav.download('favori_bti_kararlarim.json', BTIFav.exportJSON(), 'application/json');

/* ---- Elle BTI Aktar ---- */
const ovl = document.getElementById('ovl');
const mForm = document.getElementById('mForm');
const mErr = document.getElementById('mErr');

function openModal(){
  mErr.textContent = '';
  mForm.reset();
  ovl.classList.add('on'); ovl.setAttribute('aria-hidden','false');
  const first = mForm.querySelector('[name=hs]'); if(first) first.focus();
}
function closeModal(){ ovl.classList.remove('on'); ovl.setAttribute('aria-hidden','true'); }

document.getElementById('manualAdd').onclick = openModal;
document.getElementById('mClose').onclick = closeModal;
document.getElementById('mCancel').onclick = closeModal;
ovl.addEventListener('click', e=>{ if(e.target===ovl) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && ovl.classList.contains('on')) closeModal(); });

mForm.addEventListener('submit', e=>{
  e.preventDefault();
  const fd = new FormData(mForm);
  const g = k => (fd.get(k)||'').toString().trim();

  const hsFull = g('hs');
  if(!hsFull){ mErr.textContent = T('m_err_hs'); return; }

  const digits = hsFull.replace(/\D/g,'');
  const dec = {
    source:  g('source') || 'manual',
    ref:     g('ref') || ('ELLE-' + Date.now().toString(36)),
    hs:      hsFull,
    hs4:     digits.slice(0,4),
    date:    g('date'),
    title:   g('title'),
    gerekce: g('gerekce'),
    url:     g('url'),
    origin:  g('origin')
  };

  if(BTIFav.has(dec)){ mErr.textContent = T('m_dup'); return; }

  BTIFav.add(dec, g('note'));
  closeModal();
  q = ''; srcFilter = 'all';
  render();
});

window.addEventListener('bti-fav-change', ()=>{ /* aynı sekmede render zaten çağrılıyor */ });
window.addEventListener('storage', e=>{ if(e.key===BTIFav.KEY) render(); });
BTIi18n.mount(function(){ render(); });
render();
</script>
</body>
</html>
